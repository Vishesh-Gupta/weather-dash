openweather:
  url: https://api.openweathermap.org/
  # Seconds to wait between API calls to stay under the free tier limit (60 calls/min).
  request_delay_seconds: 1.1
  timeout_seconds: 10
  # Weather alerts need OpenWeather's One Call API 3.0, a separate subscription
  # ("One Call by Call": 1,000 free calls a day, then billed per call). Each
  # location costs one call per alerts interval. ONE_CALL_ENABLED overrides this.
  one_call_enabled: false

open_meteo:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  forecast_url: https://api.open-meteo.com/v1/forecast
  # Years of daily history to backfill when a location is first tracked.
  backfill_years: 5

scheduler:
  # OpenWeather refreshes current conditions roughly every 10 minutes, so polling
  # every 5 picks up each update promptly. Forecasts change a few times a day.
  current_minutes: 5
  air_quality_minutes: 30
  forecast_minutes: 60
  # Open-Meteo's hourly forecast and 15-minute rain nowcast; the nowcast updates
  # every 15 minutes in North America and Europe.
  hourly_minutes: 15
  # Only when One Call is enabled. 5 locations every 15 minutes is 480 calls a day.
  alerts_minutes: 15

events:
  # How often the API checks for new data to push to open browsers.
  poll_seconds: 3

database:
  # Used when POSTGRES_HOST / DATABASE_URL are not set (local development).
  sqlite_path: data/weather.db
