services:
  postgres:
    image: postgres:16-alpine
    container_name: weather-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather_pass}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather_user} -d ${POSTGRES_DB:-weather_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-dashboard
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-weather_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-weather_pass}
      - POSTGRES_DB=${POSTGRES_DB:-weather_db}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    networks:
      - weather-network
    command: sh -c "uv pip install -e . && streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-scheduler
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-weather_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-weather_pass}
      - POSTGRES_DB=${POSTGRES_DB:-weather_db}
      - SCHEDULER_INTERVAL_MINUTES=${SCHEDULER_INTERVAL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      dashboard:
        condition: service_started
    volumes:
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    networks:
      - weather-network
    restart: unless-stopped
    command: sh -c "uv pip install -e . && python -m src.data_collection.scheduler"

volumes:
  postgres_data:
    driver: local

networks:
  weather-network:
    driver: bridge

