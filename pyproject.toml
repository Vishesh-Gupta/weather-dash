[project]
name = "weather-analytics-dashboard"
version = "0.1.0"
description = "A powerful tool for analyzing and visualizing weather data patterns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "schedule>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.52.1",
    "sqlalchemy>=2.0.0",
    "plotly>=5.18.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "responses>=0.26.3",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
