[project]
name = "weather-analytics-dashboard"
version = "0.1.0"
description = "A powerful tool for analyzing and visualizing weather data patterns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "schedule>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "responses>=0.26.3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
